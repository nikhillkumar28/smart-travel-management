name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Ephemeral MongoDB service container for integration tests
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Step 3: Install backend and frontend dependencies
      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Run ESLint for backend and test code quality
      - name: Run ESLint
        run: npm run lint

      # Step 5: Run automated backend API tests (using test DB service and mocked external APIs)
      - name: Run backend tests
        run: npm test
        env:
          PORT: 3000
          MONGO_URI_TEST: mongodb://localhost:27017/express_auth_test
          JWT_SECRET: ci_test_jwt_secret_token_key_12345
          GEMINI_API_KEY: ci_dummy_gemini_api_key
          OPENWEATHER_API_KEY: ci_dummy_openweather_api_key

      # Step 6: Build the React frontend for production
      - name: Build React frontend
        working-directory: frontend
        run: npm run build
